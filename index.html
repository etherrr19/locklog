<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="lock log 🔒">
<title>lock log 🔒</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
/* ── THEMES ── */
body[data-theme="soft-puppy"] {
  --c-none:    #b8e8d4; --c-none-d:  #8ed4b8;
  --c-orgasm:  #f7c5d5; --c-orgasm-d:#f0a0bc;
  --c-ruined:  #ffd4b8; --c-ruined-d:#ffb894;
  --c-forbid:  #ffb3b3; --c-forbid-d:#ff8e8e;
  --c-lav:     #e8d4f7; --c-lav-d:   #c9a0dc;
  --c-cream:   #fdf8f0;
  --c-white:   #ffffff;
  --c-text:    #5a4a5a;
  --c-textlt:  #9a8a9a;
  --c-border:  #ecddf0;
  --c-shadow:  rgba(180,150,190,0.15);
  --c-shadowm: rgba(180,150,190,0.25);
  --c-bg:      linear-gradient(135deg,#fdf0f8 0%,#f0f8fd 50%,#f8fdf0 100%);
  --c-accent:  #c9a0dc;
  --c-btn:     linear-gradient(135deg,#f0c0d8,#c9a0dc);
  --c-future:  rgba(255,255,255,0.5);
  --c-tile-empty: rgba(255,255,255,0.6);
  --today-ring:#c9a0dc;
  --c-nav-bg:  rgba(255,255,255,0.9);
  --c-nav-act: #e8d4f7;
  --c-nav-acttxt:#9a60b4;
  --c-modal:   #fdf8f0;
}
body[data-theme="obedient"] {
  --c-none:    #2a2a2a; --c-none-d:  #1a1a1a;
  --c-orgasm:  #8b0000; --c-orgasm-d:#6b0000;
  --c-ruined:  #4a3000; --c-ruined-d:#3a2000;
  --c-forbid:  #5a0000; --c-forbid-d:#3a0000;
  --c-lav:     #333333; --c-lav-d:   #555555;
  --c-cream:   #1a1a1a;
  --c-white:   #2a2a2a;
  --c-text:    #e8e0d0;
  --c-textlt:  #888880;
  --c-border:  #444444;
  --c-shadow:  rgba(0,0,0,0.4);
  --c-shadowm: rgba(0,0,0,0.6);
  --c-bg:      linear-gradient(135deg,#0a0a0a 0%,#1a1a1a 100%);
  --c-accent:  #cc2200;
  --c-btn:     linear-gradient(135deg,#8b0000,#cc2200);
  --c-future:  rgba(40,40,40,0.5);
  --c-tile-empty: rgba(30,30,30,0.6);
  --today-ring:#cc2200;
  --c-nav-bg:  rgba(20,20,20,0.95);
  --c-nav-act: #333333;
  --c-nav-acttxt:#cc2200;
  --c-modal:   #1a1a1a;
}
body[data-theme="puppygirl"] {
  --c-none:    #b8eed8; --c-none-d:  #80ddb0;
  --c-orgasm:  #f5b8e8; --c-orgasm-d:#e880d0;
  --c-ruined:  #d4b8f5; --c-ruined-d:#b890e8;
  --c-forbid:  #ffaac0; --c-forbid-d:#ff7799;
  --c-lav:     #c8e8ff; --c-lav-d:   #90caf9;
  --c-cream:   #fff0fc;
  --c-white:   #ffffff;
  --c-text:    #4a3060;
  --c-textlt:  #9878b8;
  --c-border:  #e8c8f0;
  --c-shadow:  rgba(160,100,200,0.15);
  --c-shadowm: rgba(160,100,200,0.25);
  --c-bg:      linear-gradient(135deg,#fff0fc 0%,#e8f8ff 40%,#f0fff8 100%);
  --c-accent:  #d060c0;
  --c-btn:     linear-gradient(135deg,#e880d0,#9040c0);
  --c-future:  rgba(255,255,255,0.5);
  --c-tile-empty: rgba(255,240,252,0.7);
  --today-ring:#d060c0;
  --c-nav-bg:  rgba(255,240,252,0.92);
  --c-nav-act: #f5c8f0;
  --c-nav-acttxt:#a030a0;
  --c-modal:   #fff0fc;
}
body[data-theme="ravey"] {
  --c-none:    #001a00; --c-none-d:  #003300;
  --c-orgasm:  #3d0030; --c-orgasm-d:#660050;
  --c-ruined:  #001a3d; --c-ruined-d:#003366;
  --c-forbid:  #3d0000; --c-forbid-d:#660000;
  --c-lav:     #1a001a; --c-lav-d:   #330033;
  --c-cream:   #0a0a0a;
  --c-white:   #111111;
  --c-text:    #f0f0f0;
  --c-textlt:  #888888;
  --c-border:  #222222;
  --c-shadow:  rgba(0,255,100,0.1);
  --c-shadowm: rgba(0,255,100,0.2);
  --c-bg:      linear-gradient(135deg,#000000 0%,#0a000a 100%);
  --c-accent:  #00ff66;
  --c-btn:     linear-gradient(135deg,#ff00aa,#00ffcc);
  --c-future:  rgba(20,20,20,0.5);
  --c-tile-empty: rgba(15,15,15,0.8);
  --today-ring:#00ff66;
  --c-nav-bg:  rgba(5,5,5,0.95);
  --c-nav-act: #001a0a;
  --c-nav-acttxt:#00ff66;
  --c-modal:   #0a0a0a;
}
body[data-theme="rubber-pup"] {
  --c-none:    #1a1a1a; --c-none-d:  #0a0a0a;
  --c-orgasm:  #cc8800; --c-orgasm-d:#aa6600;
  --c-ruined:  #7a3000; --c-ruined-d:#5a2000;
  --c-forbid:  #880000; --c-forbid-d:#660000;
  --c-lav:     #2a2a2a; --c-lav-d:   #404040;
  --c-cream:   #111111;
  --c-white:   #1e1e1e;
  --c-text:    #f0e8d0;
  --c-textlt:  #806040;
  --c-border:  #333333;
  --c-shadow:  rgba(200,130,0,0.15);
  --c-shadowm: rgba(200,130,0,0.3);
  --c-bg:      linear-gradient(135deg,#050505 0%,#111111 100%);
  --c-accent:  #cc8800;
  --c-btn:     linear-gradient(135deg,#cc8800,#ff4400);
  --c-future:  rgba(30,30,30,0.5);
  --c-tile-empty: rgba(20,20,20,0.8);
  --today-ring:#cc8800;
  --c-nav-bg:  rgba(10,10,10,0.95);
  --c-nav-act: #2a1a00;
  --c-nav-acttxt:#cc8800;
  --c-modal:   #111111;
}

:root {
  --radius-tile: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--c-bg);
  min-height: 100vh;
  min-height: -webkit-fill-available;
  color: var(--c-text);
  overflow-x: hidden;
}

.app {
  max-width: 430px;
  margin: 0 auto;
  padding: env(safe-area-inset-top, 12px) 0 80px;
  min-height: 100vh;
}

/* ── HEADER ── */
.header {
  padding: 16px 20px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header-title {
  font-family: 'Fredoka One', cursive;
  font-size: 28px;
  color: var(--c-text);
  letter-spacing: 0.5px;
}
.header-title span { color: var(--c-accent); }
.header-streak {
  background: var(--c-orgasm);
  border-radius: 20px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 700;
  color: var(--c-text);
  display: flex;
  align-items: center;
  gap: 4px;
}

/* ── MONTH NAV ── */
.month-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px 16px;
}
.month-label {
  font-family: 'Fredoka One', cursive;
  font-size: 22px;
  color: var(--c-text);
}
.nav-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--c-white);
  box-shadow: 0 2px 8px var(--c-shadowm);
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s;
  color: var(--c-text);
}
.nav-btn:active { transform: scale(0.92); }

/* ── LEGEND ── */
.legend {
  display: flex;
  gap: 8px;
  padding: 0 20px 16px;
  flex-wrap: wrap;
}
.legend-item {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 700; color: var(--c-textlt);
}
.legend-dot {
  width: 12px; height: 12px;
  border-radius: 4px;
  flex-shrink: 0;
}

/* ── CALENDAR ── */
.calendar-wrap { padding: 0 14px; }
.day-labels {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 6px;
}
.day-label {
  text-align: center;
  font-size: 11px;
  font-weight: 800;
  color: var(--c-textlt);
  letter-spacing: 0.5px;
}
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}

/* ── TILE ── */
.tile {
  aspect-ratio: 1;
  border-radius: var(--radius-tile);
  position: relative;
  cursor: pointer;
  transition: transform 0.15s;
  overflow: visible;
}
.tile:active { transform: scale(0.92); }
.tile.empty { background: transparent; cursor: default; pointer-events: none; }
.tile.future { cursor: default; pointer-events: none; }
.tile.before-start { cursor: default; pointer-events: none; }
.tile.today .tile-inner::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: calc(var(--radius-tile) + 2px);
  border: 2.5px solid var(--today-ring);
  pointer-events: none;
}

.tile-inner {
  position: absolute;
  inset: 0;
  border-radius: var(--radius-tile);
  box-shadow: 0 2px 8px var(--c-shadow);
}
.tile-bg-none      { background: var(--c-none); }
.tile-bg-orgasm    { background: var(--c-orgasm); }
.tile-bg-ruined    { background: var(--c-ruined); }
.tile-bg-forbidden { background: var(--c-forbid); }
.tile-bg-edged     { background: var(--c-none); }
.tile-bg-future    { background: var(--c-future); }
.tile-bg-before    { background: var(--c-tile-empty); opacity:0.4; }

.tile-date {
  position: absolute;
  top: 5px; left: 7px;
  font-size: 11px;
  font-weight: 800;
  color: var(--c-text);
  opacity: 0.7;
  z-index: 2;
  line-height: 1;
}
.tile-cage {
  position: absolute;
  bottom: 4px; right: 5px;
  font-size: 11px;
  z-index: 3;
  line-height: 1;
}
.tile-stickers {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
}
.sticker {
  position: absolute;
  line-height: 1;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2));
}

/* ── STATS BAR ── */
.stats-bar {
  display: flex;
  gap: 10px;
  padding: 16px 20px 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.stats-bar::-webkit-scrollbar { display: none; }
.stat-card {
  background: var(--c-white);
  border-radius: var(--radius-lg);
  padding: 12px 16px;
  min-width: 90px;
  flex-shrink: 0;
  box-shadow: 0 2px 12px var(--c-shadow);
  text-align: center;
}
.stat-value {
  font-family: 'Fredoka One', cursive;
  font-size: 24px;
  color: var(--c-text);
  line-height: 1;
}
.stat-label {
  font-size: 9px;
  font-weight: 700;
  color: var(--c-textlt);
  letter-spacing: 0.5px;
  margin-top: 3px;
}

/* ── TOAST ── */
.toast {
  position: fixed;
  top: 60px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: var(--c-white);
  border-radius: 24px;
  padding: 12px 20px;
  box-shadow: 0 4px 24px var(--c-shadowm);
  font-size: 15px;
  font-weight: 700;
  color: var(--c-text);
  z-index: 1000;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  white-space: nowrap;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── MODAL ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--c-modal);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  padding: 20px 20px calc(env(safe-area-inset-bottom,16px) + 20px);
  width: 100%;
  max-width: 430px;
  transform: translateY(40px);
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  max-height: 88vh;
  overflow-y: auto;
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-handle {
  width: 36px; height: 4px;
  background: var(--c-border);
  border-radius: 2px;
  margin: 0 auto 16px;
}
.modal-title {
  font-family: 'Fredoka One', cursive;
  font-size: 20px;
  margin-bottom: 16px;
  text-align: center;
  color: var(--c-text);
}

/* form */
.form-section { margin-bottom: 18px; }
.form-label {
  font-size: 11px;
  font-weight: 800;
  color: var(--c-textlt);
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  display: block;
}
.pill-group { display: flex; flex-wrap: wrap; gap: 7px; }
.pill {
  padding: 7px 14px;
  border-radius: 20px;
  border: 2px solid transparent;
  background: var(--c-white);
  font-family: 'Nunito', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--c-text);
  cursor: pointer;
  transition: all 0.15s;
  box-shadow: 0 1px 4px var(--c-shadow);
}
.pill:active { transform: scale(0.95); }
.pill.sel-none    { background: var(--c-none);   border-color: var(--c-none-d); }
.pill.sel-orgasm  { background: var(--c-orgasm); border-color: var(--c-orgasm-d); }
.pill.sel-ruined  { background: var(--c-ruined); border-color: var(--c-ruined-d); }
.pill.sel-forbid  { background: var(--c-forbid); border-color: var(--c-forbid-d); }
.pill.sel-lav     { background: var(--c-lav);    border-color: var(--c-lav-d); }
.pill.sel-default { background: var(--c-lav);    border-color: var(--c-accent); }

/* sticker picker */
.sticker-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  row-gap: 28px; /* extra vertical gap for labels */
}
.sticker-pick {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: var(--c-white);
  border: 2px solid transparent;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  cursor: pointer;
  box-shadow: 0 1px 4px var(--c-shadow);
  transition: all 0.15s;
  position: relative;
  flex-shrink: 0;
  margin-bottom: 14px; /* space below for label */
}
.sticker-pick:active { transform: scale(0.88); }
.sticker-pick.selected { border-color: var(--c-accent); background: var(--c-lav); }
.sticker-label {
  position: absolute;
  bottom: -18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 8px;
  font-weight: 800;
  color: var(--c-textlt);
  white-space: nowrap;
  letter-spacing: 0.2px;
  pointer-events: none;
  text-align: center;
  max-width: 60px;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* add sticker button */
.sticker-add-btn {
  width: 48px; height: 48px;
  border-radius: 12px;
  background: var(--c-white);
  border: 2px dashed var(--c-border);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  cursor: pointer;
  color: var(--c-textlt);
  transition: all 0.15s;
  flex-shrink: 0;
  margin-bottom: 14px;
}
.sticker-add-btn:active { transform: scale(0.88); }

/* notes */
.notes-input {
  width: 100%;
  border: 2px solid var(--c-border);
  border-radius: 14px;
  padding: 10px 14px;
  font-family: 'Nunito', sans-serif;
  font-size: 14px;
  color: var(--c-text);
  background: var(--c-white);
  resize: none;
  outline: none;
  transition: border-color 0.15s;
}
.notes-input:focus { border-color: var(--c-accent); }

.save-btn {
  width: 100%;
  padding: 14px;
  border-radius: 20px;
  border: none;
  background: var(--c-btn);
  font-family: 'Fredoka One', cursive;
  font-size: 18px;
  color: white;
  cursor: pointer;
  box-shadow: 0 4px 16px var(--c-shadowm);
  transition: transform 0.15s;
  margin-top: 4px;
}
.save-btn:active { transform: scale(0.97); }
.delete-btn {
  width: 100%;
  padding: 10px;
  border-radius: 16px;
  border: 2px solid var(--c-border);
  background: transparent;
  font-family: 'Nunito', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--c-textlt);
  cursor: pointer;
  margin-top: 8px;
  transition: all 0.15s;
}

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--c-nav-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--c-border);
  padding: 8px 0 calc(env(safe-area-inset-bottom,0px) + 8px);
  display: flex;
  justify-content: space-around;
  z-index: 50;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 16px;
  cursor: pointer;
  border-radius: 14px;
  transition: background 0.15s;
  border: none; background: transparent;
}
.nav-item.active { background: var(--c-nav-act); }
.nav-icon { font-size: 22px; line-height: 1; }
.nav-text { font-size: 10px; font-weight: 800; color: var(--c-textlt); letter-spacing: 0.3px; }
.nav-item.active .nav-text { color: var(--c-nav-acttxt); }

/* ── VIEWS ── */
.view { display: none; padding: 0 20px; }
.view.active { display: block; }

/* ── SETTINGS ── */
.settings-section { margin-bottom: 24px; }
.settings-title {
  font-family: 'Fredoka One', cursive;
  font-size: 16px;
  margin-bottom: 10px;
  color: var(--c-text);
}
.cage-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--c-white);
  border-radius: 14px;
  padding: 10px 14px;
  margin-bottom: 8px;
  box-shadow: 0 1px 4px var(--c-shadow);
}
.cage-icon-preview { font-size: 22px; width: 32px; text-align: center; }
.cage-name-input {
  flex: 1;
  border: none; outline: none;
  font-family: 'Nunito', sans-serif;
  font-size: 14px; font-weight: 700;
  color: var(--c-text);
  background: transparent;
}
.toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--c-white);
  border-radius: 14px;
  padding: 12px 14px;
  box-shadow: 0 1px 4px var(--c-shadow);
  margin-bottom: 8px;
}
.toggle-label { font-size: 14px; font-weight: 700; color: var(--c-text); }
.toggle {
  width: 44px; height: 26px;
  border-radius: 13px;
  background: var(--c-border);
  position: relative;
  cursor: pointer;
  transition: background 0.2s;
  border: none;
  flex-shrink: 0;
}
.toggle.on { background: var(--c-btn); }
.toggle::after {
  content: '';
  position: absolute;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: white;
  top: 3px; left: 3px;
  transition: transform 0.2s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
}
.toggle.on::after { transform: translateX(18px); }

/* theme palette picker */
.palette-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.palette-btn {
  border-radius: 14px;
  padding: 10px 12px;
  border: 2px solid transparent;
  cursor: pointer;
  font-family: 'Nunito', sans-serif;
  font-size: 12px;
  font-weight: 800;
  transition: all 0.15s;
  display: flex; align-items: center; gap: 8px;
  text-align: left;
}
.palette-btn:active { transform: scale(0.96); }
.palette-btn.active { border-color: var(--c-accent); }
.palette-swatches { display: flex; gap: 3px; }
.swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

/* start date row */
.start-date-row {
  background: var(--c-white);
  border-radius: 14px;
  padding: 12px 14px;
  box-shadow: 0 1px 4px var(--c-shadow);

<script>
// ── CONSTANTS ──
const STORAGE_KEY = 'locklog_v2';
const TODAY = new Date();
TODAY.setHours(0,0,0,0);
const TODAY_STR = fmtDate(TODAY);

const CAGE_ICONS = ['○','🅰','🅱','🅲','🅳'];

const DEFAULT_STICKERS = [
  {id:'paw-o',   emoji:'🐾',  label:'paw orgasm'},
  {id:'vibe-o',  emoji:'📳',  label:'vibe orgasm'},
  {id:'anal-o',  emoji:'〰️', label:'anal orgasm'},
  {id:'hf-o',    emoji:'🤲',  label:'handsfree'},
  {id:'other-o', emoji:'✨',  label:'other orgasm'},
  {id:'paw-e',   emoji:'🔥',  label:'paw edge'},
  {id:'vibe-e',  emoji:'⚡',  label:'vibe edge'},
  {id:'other-e', emoji:'💫',  label:'other edge'},
  {id:'cage-chg',emoji:'🔄',  label:'cage change'},
  {id:'downsize',emoji:'⬇️', label:'downsize'},
  {id:'misbehav',emoji:'😈',  label:'misbehavior'},
  {id:'punish',  emoji:'⚡',  label:'punishment'},
  {id:'reward',  emoji:'🎁',  label:'reward'},
  {id:'bad-slp', emoji:'😴',  label:'bad sleep'},
  {id:'discomfort',emoji:'🩹',label:'discomfort'},
  {id:'key',     emoji:'🔑',  label:'key access'},
  {id:'inspect', emoji:'🔍',  label:'inspection'},
];

const THEMES = [
  {id:'soft-puppy', name:'soft puppy',  swatches:['#b8e8d4','#f7c5d5','#ffd4b8','#e8d4f7'], bg:'#fdf8f0'},
  {id:'obedient',   name:'obedient',    swatches:['#2a2a2a','#8b0000','#444444','#cc2200'], bg:'#1a1a1a'},
  {id:'puppygirl',  name:'puppygirl',   swatches:['#b8eed8','#f5b8e8','#d4b8f5','#c8e8ff'], bg:'#fff0fc'},
  {id:'ravey',      name:'ravey',       swatches:['#001a00','#3d0030','#001a3d','#00ff66'], bg:'#000000'},
  {id:'rubber-pup', name:'rubber pup',  swatches:['#1a1a1a','#cc8800','#880000','#2a2a2a'], bg:'#050505'},
];

// ── STATE ──
let state = {
  days: {},
  cages: ['Cage A','Cage B','Cage C'],
  showStickers: true,
  theme: 'soft-puppy',
  startDate: null,
  customStickers: [],
};

// editing state
let editingDate = null;
let selectedOrgasm = 'none';
let selectedCage = 'none';
let selectedStickers = new Set();
let currentYear = TODAY.getFullYear();
let currentMonth = TODAY.getMonth();

// ── HELPERS ──
function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseDate(s) {
  const [y,m,d] = s.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  dt.setHours(0,0,0,0);
  return dt;
}
function allStickers() {
  return [...DEFAULT_STICKERS, ...state.customStickers];
}

// ── PERSIST ──
function load() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if(s) state = {...state, ...JSON.parse(s)};
  } catch(e){}
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}

// ── INIT ──
function init() {
  load();
  applyTheme(state.theme);
  document.getElementById('start-date-input').value = state.startDate || '';
  renderPaletteGrid();
  renderCageSettings();
  renderCalendar();
  updateStats();
}

// ── THEME ──
function applyTheme(id) {
  state.theme = id;
  document.body.setAttribute('data-theme', id);
  // re-render legend colors (they use CSS vars so automatic)
  renderPaletteGrid();
  save();
}

function renderPaletteGrid() {
  const grid = document.getElementById('palette-grid');
  if(!grid) return;
  grid.innerHTML = '';
  THEMES.forEach(t=>{
    const btn = document.createElement('button');
    btn.className = 'palette-btn' + (state.theme===t.id?' active':'');
    btn.style.background = t.bg;
    btn.style.color = (t.id==='obedient'||t.id==='ravey'||t.id==='rubber-pup') ? '#f0f0f0' : '#5a4a5a';
    const swatchHtml = t.swatches.map(c=>`<div class="swatch" style="background:${c}"></div>`).join('');
    btn.innerHTML = `<div class="palette-swatches">${swatchHtml}</div>${t.name}`;
    btn.onclick = ()=>applyTheme(t.id);
    grid.appendChild(btn);
  });
}

// ── START DATE ──
function setStartDate(val) {
  state.startDate = val || null;
  save();
  renderCalendar();
  updateStats();
}

// ── CALENDAR ──
function changeMonth(dir) {
  currentMonth += dir;
  if(currentMonth>11){currentMonth=0;currentYear++;}
  if(currentMonth<0) {currentMonth=11;currentYear--;}
  renderCalendar();
  updateStats();
}

function renderCalendar() {
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('month-label').textContent=`${months[currentMonth]} ${currentYear}`;

  const grid = document.getElementById('calendar-grid');
  grid.innerHTML='';

  const startDt = state.startDate ? parseDate(state.startDate) : null;
  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();

  for(let i=0;i<firstDay;i++){
    const el=document.createElement('div');
    el.className='tile empty';
    grid.appendChild(el);
  }

  for(let d=1;d<=daysInMonth;d++){
    const dt = new Date(currentYear, currentMonth, d);
    dt.setHours(0,0,0,0);
    const dateStr = fmtDate(dt);
    const dayData = state.days[dateStr];
    const isToday = dateStr === TODAY_STR;
    const isFuture = dt > TODAY;
    const isBeforeStart = startDt && dt < startDt;

    const tile = document.createElement('div');
    let cls = 'tile';
    if(isToday) cls += ' today';
    if(isFuture) cls += ' future';
    if(isBeforeStart) cls += ' before-start';
    tile.className = cls;

    if(!isFuture && !isBeforeStart) {
      tile.onclick = ()=>openModal(dateStr);
    }

    const inner = document.createElement('div');
    inner.className = 'tile-inner';
    if(isFuture) {
      inner.classList.add('tile-bg-future');
    } else if(isBeforeStart) {
      inner.classList.add('tile-bg-before');
    } else if(dayData) {
      const bgMap={none:'tile-bg-none',orgasm:'tile-bg-orgasm',ruined:'tile-bg-ruined',forbidden:'tile-bg-forbidden',edged:'tile-bg-edged'};
      inner.classList.add(bgMap[dayData.orgasm]||'tile-bg-none');
    } else {
      inner.classList.add('tile-bg-none');
    }
    tile.appendChild(inner);

    const dateEl = document.createElement('div');
    dateEl.className = 'tile-date';
    dateEl.textContent = d;
    tile.appendChild(dateEl);

    // cage icon
    if(!isBeforeStart && dayData && dayData.cage) {
      const cageEl = document.createElement('div');
      cageEl.className = 'tile-cage';
      if(dayData.cage==='none') {
        cageEl.textContent = '○';
      } else {
        const idx = 'ABCD'.indexOf(dayData.cage);
        cageEl.textContent = idx>=0 ? CAGE_ICONS[idx+1] : '○';
      }
      tile.appendChild(cageEl);
    }

    // stickers
    if(state.showStickers && !isBeforeStart && dayData && dayData.stickers && dayData.stickers.length) {
      const wrap = document.createElement('div');
      wrap.className = 'tile-stickers';
      const positions=[
        {top:'15%',left:'8%',rot:-18},
        {top:'42%',left:'52%',rot:14},
        {top:'58%',left:'6%',rot:9},
      ];
      dayData.stickers.slice(0,3).forEach((sid,i)=>{
        const s = allStickers().find(x=>x.id===sid);
        if(!s) return;
        const pos = positions[i%positions.length];
        const el = document.createElement('span');
        el.className='sticker';
        el.textContent=s.emoji;
        el.style.cssText=`top:${pos.top};left:${pos.left};transform:rotate(${pos.rot}deg);font-size:${i===0?'12px':'9px'}`;
        wrap.appendChild(el);
      });
      tile.appendChild(wrap);
    }

    grid.appendChild(tile);
  }
}

// ── STATS ──
function updateStats() {
  const startDt = state.startDate ? parseDate(state.startDate) : null;
  const prefix = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
  let locked=0,orgasms=0,ruined=0,edges=0;

  Object.entries(state.days).forEach(([k,v])=>{
    if(!k.startsWith(prefix)) return;
    if(startDt && parseDate(k) < startDt) return;
    if(v.cage && v.cage!=='none') locked++;
    if(v.orgasm==='orgasm') orgasms++;
    if(v.orgasm==='ruined') ruined++;
    if(v.orgasm==='edged') edges++;
  });
  document.getElementById('stat-locked').textContent=locked;
  document.getElementById('stat-orgasms').textContent=orgasms;
  document.getElementById('stat-ruined').textContent=ruined;
  document.getElementById('stat-edges').textContent=edges;

  // total days tracked
  let tracked = 0;
  if(startDt) {
    const now = new Date(); now.setHours(0,0,0,0);
    const diff = Math.floor((now-startDt)/(1000*60*60*24));
    tracked = Math.max(0, diff+1);
  }
  document.getElementById('stat-tracked').textContent = tracked;

  // lock streak
  let streak=0;
  for(let i=0;i<365;i++){
    const d=new Date(TODAY); d.setDate(d.getDate()-i);
    const ds=fmtDate(d);
    if(startDt && d<startDt) break;
    const day=state.days[ds];
    if(day && day.cage && day.cage!=='none') streak++;
    else if(i>0) break;
  }
  document.getElementById('streak-badge').textContent=`🔒 ${streak} day${streak!==1?'s':''}`;
  checkFeedback(streak);
}

// ── FEEDBACK ──
let lastFeedbackStreak = -1;
function checkFeedback(streak) {
  if(streak===lastFeedbackStreak) return;
  lastFeedbackStreak=streak;
  const msgs=[
    {min:6,max:10,  msg:'good puppy! 🐾'},
    {min:11,max:20, msg:'such a patient pup! 🔒✨'},
    {min:21,max:999,msg:'owner must be very proud 🥺🐶'},
  ];
  const match=msgs.find(m=>streak>=m.min&&streak<=m.max);
  if(match&&streak>0) showToast(match.msg);
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

// ── MODAL ──
function openModal(dateStr) {
  editingDate=dateStr;
  const d=parseDate(dateStr);
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('modal-date-title').textContent=`${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;

  const dayData=state.days[dateStr]||{};
  selectedOrgasm=dayData.orgasm||'none';
  selectedCage=dayData.cage||'none';
  selectedStickers=new Set(dayData.stickers||[]);
  document.getElementById('day-notes').value=dayData.notes||'';

  // orgasm pills
  document.querySelectorAll('#orgasm-pills .pill').forEach(p=>{
    p.className='pill';
    if(p.dataset.val===selectedOrgasm) p.classList.add(`sel-${p.dataset.col}`);
  });

  renderCagePills();
  renderStickerPicker();
  document.getElementById('modal-overlay').classList.add('open');
}

function renderCagePills() {
  const wrap=document.getElementById('cage-pills');
  wrap.innerHTML='';
  const opts=[{val:'none',label:'🔓 no cage'},...state.cages.map((c,i)=>({val:'ABCD'[i],label:`${CAGE_ICONS[i+1]} ${c}`}))];
  opts.forEach(o=>{
    const btn=document.createElement('button');
    btn.className='pill'+(o.val===selectedCage?' sel-default':'');
    btn.textContent=o.label;
    btn.onclick=()=>{
      selectedCage=o.val;
      document.querySelectorAll('#cage-pills .pill').forEach(p=>p.className='pill');
      btn.classList.add('sel-default');
    };
    wrap.appendChild(btn);
  });
}

function renderStickerPicker() {
  const wrap=document.getElementById('sticker-picker');
  wrap.innerHTML='';
  allStickers().forEach(s=>{
    const btn=document.createElement('button');
    btn.className='sticker-pick'+(selectedStickers.has(s.id)?' selected':'');
    btn.dataset.id=s.id;
    btn.innerHTML=`${s.emoji}<span class="sticker-label">${s.label}</span>`;
    btn.onclick=()=>{
      if(selectedStickers.has(s.id)) selectedStickers.delete(s.id);
      else selectedStickers.add(s.id);
      btn.classList.toggle('selected',selectedStickers.has(s.id));
    };
    wrap.appendChild(btn);
  });
  // plus button
  const addBtn=document.createElement('button');
  addBtn.className='sticker-add-btn';
  addBtn.innerHTML='＋';
  addBtn.title='add custom sticker';
  addBtn.onclick=openAddSticker;
  wrap.appendChild(addBtn);
}

function selectOrgasm(btn) {
  document.querySelectorAll('#orgasm-pills .pill').forEach(p=>p.className='pill');
  selectedOrgasm=btn.dataset.val;
  btn.classList.add(`sel-${btn.dataset.col}`);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editingDate=null;
}
function closeModalOnOverlay(e) {
  if(e.target===document.getElementById('modal-overlay')) closeModal();
}

function saveDay() {
  if(!editingDate) return;
  state.days[editingDate]={
    orgasm:selectedOrgasm,
    cage:selectedCage,
    stickers:[...selectedStickers],
    notes:document.getElementById('day-notes').value
  };
  save(); renderCalendar(); updateStats();
  const o=selectedOrgasm;
  if(o==='orgasm')    showToast('lucky girl! 🌸');
  else if(o==='forbidden') showToast('uh oh... 😬');
  else if(o==='ruined')    showToast('so close, pup~ 🍑');
  closeModal();
}

function clearDay() {
  if(!editingDate) return;
  delete state.days[editingDate];
  save(); renderCalendar(); updateStats(); closeModal();
}

// ── ADD CUSTOM STICKER ──
function openAddSticker() {
  document.getElementById('emoji-input').value='';
  document.getElementById('sticker-name-input').value='';
  document.getElementById('emoji-preview-display').textContent='🐾';
  document.getElementById('add-sticker-overlay').classList.add('open');
}
function closeAddStickerOnOverlay(e) {
  if(e.target===document.getElementById('add-sticker-overlay'))
    document.getElementById('add-sticker-overlay').classList.remove('open');
}
function updateEmojiPreview(val) {
  const trimmed=[...val.trim()].slice(0,2).join('');
  document.getElementById('emoji-preview-display').textContent=trimmed||'🐾';
}
function saveCustomSticker() {
  const emoji=[...document.getElementById('emoji-input').value.trim()].slice(0,2).join('') || '⭐';
  const label=document.getElementById('sticker-name-input').value.trim() || 'custom';
  const id='custom-'+Date.now();
  state.customStickers.push({id,emoji,label});
  save();
  document.getElementById('add-sticker-overlay').classList.remove('open');
  renderStickerPicker();
  showToast(`sticker "${label}" added! ✨`);
}

// ── SETTINGS ──
function renderCageSettings() {
  const list=document.getElementById('cage-list');
  if(!list) return;
  list.innerHTML='';
  state.cages.forEach((c,i)=>{
    const row=document.createElement('div');
    row.className='cage-row';
    row.innerHTML=`<div class="cage-icon-preview">${CAGE_ICONS[i+1]}</div>
      <input class="cage-name-input" value="${c}" onchange="state.cages[${i}]=this.value;save()">`;
    list.appendChild(row);
  });
}

function toggleStickers() {
  state.showStickers=!state.showStickers;
  document.getElementById('sticker-toggle').classList.toggle('on',state.showStickers);
  save(); renderCalendar();
}

function clearAllData() {
  if(!confirm('clear all data? this cannot be undone 🥺')) return;
  state.days={};
  save(); renderCalendar(); updateStats();
}

// ── NAV ──
function switchView(v) {
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.getElementById('nav-'+v).classList.add('active');
  if(v==='settings'){renderCageSettings();renderPaletteGrid();}
}

// ── EXPORT ──
function exportImage() {
  showToast('screenshot the calendar to share! 📸');
}

// ── START ──
init();
</script>
</body>
</html>
