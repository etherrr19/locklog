<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="pup lock">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png">
<title>pup lock</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
/* ══════════ THEMES ══════════ */
body[data-theme="soft-puppy"] {
  --c-none:#b8e8d4; --c-none-d:#8ed4b8;
  --c-orgasm:#f7c5d5; --c-orgasm-d:#f0a0bc;
  --c-ruined:#ffd4b8; --c-ruined-d:#ffb894;
  --c-forbid:#ffb3b3; --c-forbid-d:#ff8e8e;
  --c-lav:#e8d4f7; --c-lav-d:#c9a0dc;
  --c-cream:#fdf8f0; --c-white:#ffffff;
  --c-text:#5a4a5a; --c-textlt:#9a8a9a;
  --c-border:#ecddf0;
  --c-shadow:rgba(180,150,190,0.15);
  --c-shadowm:rgba(180,150,190,0.28);
  --c-bg:linear-gradient(135deg,#fdf0f8 0%,#f0f8fd 50%,#f8fdf0 100%);
  --c-accent:#c9a0dc; --c-btn:linear-gradient(135deg,#f0c0d8,#c9a0dc);
  --c-future:rgba(255,255,255,0.45); --c-tile-empty:rgba(255,255,255,0.55);
  --today-ring:#c9a0dc;
  --c-nav-bg:rgba(255,255,255,0.92); --c-nav-act:#e8d4f7; --c-nav-acttxt:#9a60b4;
  --c-modal:#fdf8f0; --c-card:#ffffff;
}
body[data-theme="obedient"] {
  --c-none:#2a2a2a; --c-none-d:#1a1a1a;
  --c-orgasm:#8b0000; --c-orgasm-d:#6b0000;
  --c-ruined:#4a3000; --c-ruined-d:#3a2000;
  --c-forbid:#5a0000; --c-forbid-d:#3a0000;
  --c-lav:#333; --c-lav-d:#555;
  --c-cream:#1a1a1a; --c-white:#2a2a2a;
  --c-text:#e8e0d0; --c-textlt:#888880;
  --c-border:#444;
  --c-shadow:rgba(0,0,0,0.4); --c-shadowm:rgba(0,0,0,0.6);
  --c-bg:linear-gradient(135deg,#0a0a0a,#1a1a1a);
  --c-accent:#cc2200; --c-btn:linear-gradient(135deg,#8b0000,#cc2200);
  --c-future:rgba(40,40,40,0.5); --c-tile-empty:rgba(30,30,30,0.6);
  --today-ring:#cc2200;
  --c-nav-bg:rgba(20,20,20,0.95); --c-nav-act:#333; --c-nav-acttxt:#cc2200;
  --c-modal:#1a1a1a; --c-card:#222;
}
body[data-theme="puppygirl"] {
  --c-none:#b8eed8; --c-none-d:#80ddb0;
  --c-orgasm:#f5b8e8; --c-orgasm-d:#e880d0;
  --c-ruined:#d4b8f5; --c-ruined-d:#b890e8;
  --c-forbid:#ffaac0; --c-forbid-d:#ff7799;
  --c-lav:#c8e8ff; --c-lav-d:#90caf9;
  --c-cream:#fff0fc; --c-white:#ffffff;
  --c-text:#4a3060; --c-textlt:#9878b8;
  --c-border:#e8c8f0;
  --c-shadow:rgba(160,100,200,0.15); --c-shadowm:rgba(160,100,200,0.25);
  --c-bg:linear-gradient(135deg,#fff0fc,#e8f8ff 40%,#f0fff8);
  --c-accent:#d060c0; --c-btn:linear-gradient(135deg,#e880d0,#9040c0);
  --c-future:rgba(255,255,255,0.5); --c-tile-empty:rgba(255,240,252,0.7);
  --today-ring:#d060c0;
  --c-nav-bg:rgba(255,240,252,0.92); --c-nav-act:#f5c8f0; --c-nav-acttxt:#a030a0;
  --c-modal:#fff0fc; --c-card:#ffffff;
}
body[data-theme="ravey"] {
  --c-none:#001a00; --c-none-d:#003300;
  --c-orgasm:#3d0030; --c-orgasm-d:#660050;
  --c-ruined:#001a3d; --c-ruined-d:#003366;
  --c-forbid:#3d0000; --c-forbid-d:#660000;
  --c-lav:#1a001a; --c-lav-d:#330033;
  --c-cream:#0a0a0a; --c-white:#111;
  --c-text:#f0f0f0; --c-textlt:#888;
  --c-border:#222;
  --c-shadow:rgba(0,255,100,0.1); --c-shadowm:rgba(0,255,100,0.2);
  --c-bg:linear-gradient(135deg,#000,#0a000a);
  --c-accent:#00ff66; --c-btn:linear-gradient(135deg,#ff00aa,#00ffcc);
  --c-future:rgba(20,20,20,0.5); --c-tile-empty:rgba(15,15,15,0.8);
  --today-ring:#00ff66;
  --c-nav-bg:rgba(5,5,5,0.95); --c-nav-act:#001a0a; --c-nav-acttxt:#00ff66;
  --c-modal:#0a0a0a; --c-card:#111;
}
body[data-theme="rubber-pup"] {
  --c-none:#1a1a1a; --c-none-d:#0a0a0a;
  --c-orgasm:#cc8800; --c-orgasm-d:#aa6600;
  --c-ruined:#7a3000; --c-ruined-d:#5a2000;
  --c-forbid:#880000; --c-forbid-d:#660000;
  --c-lav:#2a2a2a; --c-lav-d:#404040;
  --c-cream:#111; --c-white:#1e1e1e;
  --c-text:#f0e8d0; --c-textlt:#806040;
  --c-border:#333;
  --c-shadow:rgba(200,130,0,0.15); --c-shadowm:rgba(200,130,0,0.3);
  --c-bg:linear-gradient(135deg,#050505,#111);
  --c-accent:#cc8800; --c-btn:linear-gradient(135deg,#cc8800,#ff4400);
  --c-future:rgba(30,30,30,0.5); --c-tile-empty:rgba(20,20,20,0.8);
  --today-ring:#cc8800;
  --c-nav-bg:rgba(10,10,10,0.95); --c-nav-act:#2a1a00; --c-nav-acttxt:#cc8800;
  --c-modal:#111; --c-card:#1e1e1e;
}

:root { --radius-tile:16px; --radius-lg:24px; --radius-xl:32px; }

/* ══════════ DENSITY (default = larger/tighter, compact = original sizing) ══════════ */
body[data-density="default"] {
  --d-app-pad-x:0; --d-app-pad-bottom:0px;
  --d-header-pad:12px 10px 4px; --d-header-title-size:28px; --d-header-logo-size:34px;
  --d-stat-tiles-pad:2px 10px 4px; --d-stat-tiles-gap:8px;
  --d-stat-tile-pad:10px 12px 8px; --d-stat-tile-minw:90px;
  --d-stat-icon-size:20px; --d-stat-val-size:22px; --d-stat-lbl-size:9px;
  --d-month-nav-pad:4px 10px 4px; --d-month-label-size:22px;
  --d-legend-pad:2px 10px 4px; --d-legend-gap:8px;
  --d-calendar-pad:0 8px; --d-day-label-gap:3px; --d-grid-gap:5px;
  --d-tile-date-size:12px; --d-cage-icon-size:20px;
  --d-sticker-size:23px; --d-sticker-img-size:23px;
  --d-sticker-pos1-top:6%; --d-sticker-pos1-left:4%;
  --d-sticker-pos2-top:36%; --d-sticker-pos2-left:44%;
  --d-export-pad:10px 16px; --d-export-margin:8px 0 4px;
  --d-bottomnav-pad:8px 0 calc(env(safe-area-inset-bottom,0px) + 8px);
  --d-nav-icon-size:24px; --d-nav-item-pad:6px 16px;
  --d-sticker-pick-size:58px; --d-sticker-pick-img:32px;
  --d-pill-pad:8px 15px; --d-pill-font:14px; --d-pill-img:20px;
}
body[data-density="compact"] {
  --d-app-pad-x:0; --d-app-pad-bottom:84px;
  --d-header-pad:14px 20px 10px; --d-header-title-size:26px; --d-header-logo-size:32px;
  --d-stat-tiles-pad:4px 20px 6px; --d-stat-tiles-gap:10px;
  --d-stat-tile-pad:12px 14px 10px; --d-stat-tile-minw:90px;
  --d-stat-icon-size:18px; --d-stat-val-size:22px; --d-stat-lbl-size:9px;
  --d-month-nav-pad:10px 20px 14px; --d-month-label-size:22px;
  --d-legend-pad:0 20px 14px; --d-legend-gap:8px;
  --d-calendar-pad:0 14px; --d-day-label-gap:2px; --d-grid-gap:5px;
  --d-tile-date-size:11px; --d-cage-icon-size:16px;
  --d-sticker-size:17px; --d-sticker-img-size:19px;
  --d-sticker-pos1-top:8%; --d-sticker-pos1-left:6%;
  --d-sticker-pos2-top:38%; --d-sticker-pos2-left:46%;
  --d-export-pad:10px 16px; --d-export-margin:14px 0 0;
  --d-bottomnav-pad:8px 0 calc(env(safe-area-inset-bottom,0px) + 8px);
  --d-nav-icon-size:22px; --d-nav-item-pad:6px 16px;
  --d-sticker-pick-size:52px; --d-sticker-pick-img:28px;
  --d-pill-pad:7px 14px; --d-pill-font:13px; --d-pill-img:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body {
  font-family:'Nunito',sans-serif;
  background:var(--c-bg);
  min-height:100vh; min-height:-webkit-fill-available;
  color:var(--c-text); overflow-x:hidden;
}
.app {
  max-width:430px; margin:0 auto;
  padding:env(safe-area-inset-top,12px) var(--d-app-pad-x) 0;
  height:100vh; height:-webkit-fill-available;
  display:flex; flex-direction:column;
  overflow:hidden;
}

/* ── HEADER ── */
.header {
  padding:var(--d-header-pad);
  display:flex; align-items:center; justify-content:space-between;
  gap:8px;
}
.header-title {
  font-family:'Fredoka One',cursive;
  font-size:var(--d-header-title-size); color:var(--c-text); letter-spacing:0.5px;
  flex-shrink:0;
  display:flex; align-items:center; gap:8px;
}
.header-logo { height:var(--d-header-logo-size); width:auto; display:block; }
.header-pins {
  display:flex; gap:6px; align-items:center;
  flex-wrap:nowrap; overflow:hidden;
  flex:1; justify-content:flex-end;
}
.pin-pill {
  background:var(--c-card);
  border-radius:20px;
  padding:5px 10px;
  font-size:12px; font-weight:800;
  color:var(--c-text);
  box-shadow:0 2px 8px var(--c-shadowm);
  white-space:nowrap;
  display:flex; align-items:center; gap:4px;
  flex-shrink:0;
}
.pin-pill-icon { font-size:13px; display:flex; align-items:center; }
.pin-pill-icon img { width:14px; height:14px; display:block; }
.pin-pill-val { font-family:'Fredoka One',cursive; font-size:14px; line-height:1; }

/* ── STAT TILES ROW ── */
.stat-tiles-wrap {
  padding:var(--d-stat-tiles-pad);
  overflow-x:auto; scrollbar-width:none;
  display:flex; gap:var(--d-stat-tiles-gap);
  -webkit-overflow-scrolling:touch;
}
.stat-tiles-wrap::-webkit-scrollbar { display:none; }

.stat-tile {
  background:var(--c-card);
  border-radius:20px;
  padding:var(--d-stat-tile-pad);
  min-width:var(--d-stat-tile-minw); flex-shrink:0;
  box-shadow:0 2px 10px var(--c-shadow);
  text-align:center;
  position:relative;
  cursor:pointer;
  user-select:none;
  transition:transform 0.15s, box-shadow 0.15s;
  -webkit-user-select:none;
}
.stat-tile:active { transform:scale(0.94); }
.stat-tile.pinned { box-shadow:0 2px 10px var(--c-shadow), 0 0 0 2px var(--c-accent); }
.stat-tile-icon { font-size:var(--d-stat-icon-size); line-height:1; margin-bottom:3px; display:flex; align-items:center; justify-content:center; }
.stat-tile-icon img { width:var(--d-stat-icon-size); height:var(--d-stat-icon-size); display:block; }
.stat-tile-val {
  font-family:'Fredoka One',cursive;
  font-size:var(--d-stat-val-size); color:var(--c-text); line-height:1;
}
.stat-tile-lbl {
  font-size:var(--d-stat-lbl-size); font-weight:800;
  color:var(--c-textlt); letter-spacing:0.4px;
  margin-top:3px; line-height:1.2;
}
.stat-tile-pin { position:absolute; top:5px; right:6px; font-size:9px; opacity:0.7; line-height:1; }
.stat-tile.pressing { transform:scale(0.94); box-shadow:0 0 0 3px var(--c-accent); }
.stat-hint { font-size:10px; font-weight:700; color:var(--c-textlt); text-align:center; padding:2px 20px 8px; letter-spacing:0.3px; }

/* ── MONTH NAV ── */
.month-nav { display:flex; align-items:center; justify-content:space-between; padding:var(--d-month-nav-pad); flex-shrink:0; }
.month-label { font-family:'Fredoka One',cursive; font-size:var(--d-month-label-size); color:var(--c-text); cursor:pointer; user-select:none; -webkit-user-select:none; }
.nav-btn {
  width:36px; height:36px; border-radius:50%; border:none;
  background:var(--c-white); box-shadow:0 2px 8px var(--c-shadowm);
  font-size:16px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:transform 0.15s; color:var(--c-text); flex-shrink:0;
}
.nav-btn:active { transform:scale(0.88); }

/* ── LEGEND ── */
.legend { display:flex; gap:var(--d-legend-gap); padding:var(--d-legend-pad); flex-wrap:wrap; flex-shrink:0; }
.legend-item { display:flex; align-items:center; gap:4px; font-size:10px; font-weight:700; color:var(--c-textlt); }
.legend-dot { width:10px; height:10px; border-radius:3px; flex-shrink:0; }
.legend-sticker { display:flex; align-items:center; gap:4px; font-size:10px; font-weight:700; color:var(--c-textlt); }
.legend-sticker img { width:13px; height:13px; display:block; }

/* ── CALENDAR ── */
.calendar-wrap { padding:var(--d-calendar-pad); flex:1; display:flex; flex-direction:column; min-height:0; }
.day-labels { display:grid; grid-template-columns:repeat(7,1fr); gap:var(--d-day-label-gap); margin-bottom:4px; flex-shrink:0; }
.day-label { text-align:center; font-size:11px; font-weight:800; color:var(--c-textlt); letter-spacing:0.5px; }
.calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:var(--d-grid-gap); flex:1; align-content:stretch; }

/* ── TILE ── */
.tile { border-radius:var(--radius-tile); position:relative; cursor:pointer; transition:transform 0.12s; overflow:visible; min-height:0; }
.tile:active { transform:scale(0.9); }
.tile.empty { background:transparent; cursor:default; pointer-events:none; }
.tile.future,.tile.before-start { cursor:default; pointer-events:none; }
.tile.today .tile-inner::after {
  content:''; position:absolute; inset:-2px;
  border-radius:calc(var(--radius-tile) + 2px);
  border:2.5px solid var(--today-ring); pointer-events:none;
}
.tile-inner { position:absolute; inset:0; border-radius:var(--radius-tile); box-shadow:0 2px 8px var(--c-shadow); }
.tile-bg-none      { background:var(--c-none); }
.tile-bg-orgasm    { background:var(--c-orgasm); }
.tile-bg-ruined    { background:var(--c-ruined); }
.tile-bg-forbidden { background:var(--c-forbid); }
.tile-bg-future    { background:var(--c-future); }
.tile-bg-before    { background:var(--c-tile-empty); opacity:0.4; }

.tile-date { position:absolute; top:5px; left:7px; font-size:var(--d-tile-date-size); font-weight:800; color:var(--c-text); opacity:0.7; z-index:2; line-height:1; }
.tile-cage { position:absolute; top:4px; right:5px; font-size:11px; z-index:3; line-height:1; display:flex; align-items:center; justify-content:center; }
.tile-cage img { width:var(--d-cage-icon-size); height:var(--d-cage-icon-size); display:block; filter:drop-shadow(0 1px 2px rgba(0,0,0,0.2)); }
.tile-stickers { position:absolute; top:25%; left:0; right:0; bottom:0; z-index:4; pointer-events:none; overflow:hidden; border-radius:0 0 var(--radius-tile) var(--radius-tile); }
.sticker { position:absolute; line-height:1; filter:drop-shadow(0 1px 3px rgba(0,0,0,0.22)); font-size:var(--d-sticker-size); }
.sticker img { width:var(--d-sticker-img-size); height:var(--d-sticker-img-size); display:block; filter:drop-shadow(0 1px 3px rgba(0,0,0,0.22)); }

/* ── TOAST ── */
.toast {
  position:fixed; top:60px; left:50%;
  transform:translateX(-50%) translateY(-20px);
  background:var(--c-white); border-radius:24px; padding:11px 20px;
  box-shadow:0 4px 24px var(--c-shadowm);
  font-size:14px; font-weight:700; color:var(--c-text);
  z-index:1000; opacity:0;
  transition:opacity 0.3s,transform 0.3s;
  white-space:nowrap; pointer-events:none;
  max-width:320px; text-align:center;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ── MODAL ── */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.35);
  backdrop-filter:blur(4px); z-index:100;
  display:flex; align-items:flex-end; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity 0.25s;
}
.modal-overlay.open { opacity:1; pointer-events:all; }
.modal {
  background:var(--c-modal);
  border-radius:var(--radius-xl) var(--radius-xl) 0 0;
  padding:20px 20px calc(env(safe-area-inset-bottom,16px) + 20px);
  width:100%; max-width:430px;
  transform:translateY(40px);
  transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  max-height:90vh; overflow-y:auto;
}
.modal-overlay.open .modal { transform:translateY(0); }
.modal-handle { width:36px; height:4px; background:var(--c-border); border-radius:2px; margin:0 auto 16px; }
.modal-title { font-family:'Fredoka One',cursive; font-size:20px; margin-bottom:16px; text-align:center; color:var(--c-text); }

/* mood */
.mood-prompt { font-family:'Fredoka One',cursive; font-size:17px; color:var(--c-text); margin-bottom:10px; text-align:center; }
.mood-group { display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin-bottom:4px; }
.mood-pill {
  padding:7px 13px; border-radius:20px; border:2px solid transparent;
  background:var(--c-white); font-family:'Nunito',sans-serif;
  font-size:12px; font-weight:700; color:var(--c-text); cursor:pointer;
  transition:all 0.15s; box-shadow:0 1px 4px var(--c-shadow);
}
.mood-pill:active { transform:scale(0.93); }
.mood-pill.selected { background:var(--c-lav); border-color:var(--c-accent); }

.divider { height:1px; background:var(--c-border); margin:8px 0 16px; }
.form-section { margin-bottom:16px; }
.form-label { font-size:11px; font-weight:800; color:var(--c-textlt); letter-spacing:0.5px; margin-bottom:8px; display:block; }
.pill-group { display:flex; flex-wrap:wrap; gap:7px; }
.pill {
  padding:7px 14px; border-radius:20px; border:2px solid transparent;
  background:var(--c-white); font-family:'Nunito',sans-serif;
  font-size:13px; font-weight:700; color:var(--c-text); cursor:pointer;
  transition:all 0.15s; box-shadow:0 1px 4px var(--c-shadow);
  display:inline-flex; align-items:center; gap:6px;
}
.pill img { width:18px; height:18px; display:block; }
.pill:active { transform:scale(0.93); }
.pill.sel-none   { background:var(--c-none);   border-color:var(--c-none-d); }
.pill.sel-orgasm { background:var(--c-orgasm); border-color:var(--c-orgasm-d); }
.pill.sel-ruined { background:var(--c-ruined); border-color:var(--c-ruined-d); }
.pill.sel-forbid { background:var(--c-forbid); border-color:var(--c-forbid-d); }
.pill.sel-def    { background:var(--c-lav);    border-color:var(--c-accent); }

/* sticker picker */
.sticker-grid { display:flex; flex-wrap:wrap; gap:10px; padding-bottom:4px; }
.sticker-pick {
  width:52px; height:52px; border-radius:12px;
  background:var(--c-white); border:2px solid transparent;
  display:flex; align-items:center; justify-content:center;
  font-size:22px; cursor:pointer;
  box-shadow:0 1px 4px var(--c-shadow);
  transition:all 0.15s; position:relative;
  flex-shrink:0; margin-bottom:18px;
}
.sticker-pick img { width:28px; height:28px; }
.sticker-pick:active { transform:scale(0.88); }
.sticker-pick.selected { border-color:var(--c-accent); background:var(--c-lav); }
.sticker-label {
  position:absolute; bottom:-16px; left:50%; transform:translateX(-50%);
  font-size:8px; font-weight:800; color:var(--c-textlt); white-space:nowrap;
  pointer-events:none; max-width:58px; overflow:hidden; text-overflow:ellipsis; text-align:center;
}
.sticker-add-btn {
  width:52px; height:52px; border-radius:12px; background:var(--c-white);
  border:2px dashed var(--c-border);
  display:flex; align-items:center; justify-content:center;
  font-size:24px; cursor:pointer; color:var(--c-textlt);
  transition:all 0.15s; flex-shrink:0; margin-bottom:18px;
}
.sticker-add-btn:active { transform:scale(0.88); }

.notes-input {
  width:100%; border:2px solid var(--c-border); border-radius:14px;

function load(){
  try{
    const s=localStorage.getItem(STORAGE_KEY);
    if(s){
      const p=JSON.parse(s);
      state={...state,...p};
      STAT_DEFS.forEach(sd=>{ if(state.statEnabled[sd.id]===undefined) state.statEnabled[sd.id]=true; });
      if(!state.cages||!state.cages.length) state.cages=JSON.parse(JSON.stringify(DEFAULT_CAGES));
      return;
    }
    // try migrating from older version keys
    migrateOldData();
  }catch(e){}
}
function migrateOldData(){
  for(const oldKey of ['locklog_v5','locklog_v4','locklog_v3','locklog_v2','locklog_v1']){
    try{
      const raw=localStorage.getItem(oldKey);
      if(!raw) continue;
      const old=JSON.parse(raw);
      if(old.days){
        Object.entries(old.days).forEach(([dateStr,day])=>{
          const newStickers=new Set();
          (day.stickers||[]).forEach(sid=>{
            const mig=STICKER_MIGRATION[sid];
            if(mig){ newStickers.add(mig.id); if(mig.addEdge) newStickers.add('edge'); }
            else newStickers.add(sid);
          });
          let orgasm=day.orgasm||'none';
          if(orgasm==='edged'){ orgasm='none'; newStickers.add('edge'); }
          state.days[dateStr]={...day, orgasm, stickers:[...newStickers]};
        });
      }
      if(old.theme) state.theme=old.theme;
      if(old.startDate) state.startDate=old.startDate;
      // migrate old petName to identityTags
      if(old.petName){
        const name=old.petName==='custom'?(old.petNameCustom||'pup'):old.petName;
        if(PRESET_IDENTITY_TAGS.includes(name)) state.identityTags=[name];
        else { state.identityTags=['pup']; state.customIdentityTags=[{value:name}]; }
      }
      // migrate identityTags if already present
      if(old.identityTags) state.identityTags=old.identityTags;
      if(old.customIdentityTags) state.customIdentityTags=old.customIdentityTags;
      if(old.showStickers!==undefined) state.showStickers=old.showStickers;
      // old simple cage names (A/B/C strings) -> map onto default cage objects by name
      if(old.cages && Array.isArray(old.cages) && typeof old.cages[0]==='string'){
        state.cages=old.cages.map((name,i)=>({
          id:'c'+i, name, icon:DEFAULT_CAGES[i%DEFAULT_CAGES.length].icon
        }));
        // remap day cage refs from 'A'/'B'/'C'/'none' to new ids
        Object.values(state.days).forEach(day=>{
          const idx='ABCD'.indexOf(day.cage);
          day.cage = idx>=0 && state.cages[idx] ? state.cages[idx].id : 'none';
        });
      }
      save();
      break;
    }catch(e){}
  }
}

// ══════════════════════════════════════
//  COMPUTE STATS (all cumulative)
// ══════════════════════════════════════
function computeStats(){
  const startDt=state.startDate?parseDate(state.startDate):null;
  const entries=Object.entries(state.days)
    .filter(([k])=>!startDt||parseDate(k)>=startDt)
    .sort(([a],[b])=>a<b?-1:1);

  let tracked=0;
  if(startDt){ tracked=Math.max(0,Math.floor((TODAY-startDt)/86400000)+1); }

  let locked=0,unlocked=0,orgasms=0,ruined=0,edges=0,forbidden=0;
  entries.forEach(([,v])=>{
    if(v.cage&&v.cage!=='none') locked++; else unlocked++;
    if(v.orgasm==='orgasm')    orgasms++;
    if(v.orgasm==='ruined')    ruined++;
    if(v.orgasm==='forbidden') forbidden++;
    if(v.stickers&&v.stickers.includes('edge')) edges++;
  });

  let lockStreak=0;
  for(let i=0;i<730;i++){
    const d=new Date(TODAY); d.setDate(d.getDate()-i);
    if(startDt&&d<startDt) break;
    const ds=fmtDate(d);
    const day=state.days[ds];
    if(day&&day.cage&&day.cage!=='none') lockStreak++;
    else if(i>0) break;
  }

  let longestLock=0,curLock=0;
  entries.forEach(([,v])=>{
    if(v.cage&&v.cage!=='none'){curLock++; longestLock=Math.max(longestLock,curLock);}
    else curLock=0;
  });

  let sinceOrgasm=tracked;
  for(let i=0;i<730;i++){
    const d=new Date(TODAY); d.setDate(d.getDate()-i);
    if(startDt&&d<startDt){sinceOrgasm=i; break;}
    const ds=fmtDate(d);
    const day=state.days[ds];
    if(day&&(day.orgasm==='orgasm'||day.orgasm==='ruined')){sinceOrgasm=i; break;}
  }

  let longestDenial=0,curDenial=0;
  entries.forEach(([,v])=>{
    if(v.orgasm==='orgasm'||v.orgasm==='ruined'){longestDenial=Math.max(longestDenial,curDenial);curDenial=0;}
    else curDenial++;
  });
  longestDenial=Math.max(longestDenial,curDenial);

  return {tracked,locked,unlocked,orgasms,ruined,edges,forbidden,lockStreak,longestLock,sinceOrgasm,longestDenial};
}

function checkFeedback(streak){
  if(streak===lastFeedbackStreak) return;
  lastFeedbackStreak=streak;
  const thresholds=[55,31,21,11,6];
  for(const t of thresholds){
    if(streak>=t){ showToast(pick(STREAK_MSGS[t])()); return; }

}
let toastQueue=[], toastBusy=false;
function showToast(msg){ toastQueue.push(msg); if(!toastBusy) processToast(); }
function processToast(){
  if(!toastQueue.length){toastBusy=false;return;}
  toastBusy=true;
  const t=document.getElementById('toast');
  t.textContent=toastQueue.shift();
  t.classList.add('show');
  setTimeout(()=>{t.classList.remove('show');setTimeout(processToast,400);},3000);
}

      }
    }

    if(state.showStickers&&!isBeforeStart&&dayData&&dayData.stickers&&dayData.stickers.length){
      const wrap=document.createElement('div');
      wrap.className='tile-stickers';
      const cs=getComputedStyle(document.body);
      const pos=[
        {top:cs.getPropertyValue('--d-sticker-pos1-top').trim(), left:cs.getPropertyValue('--d-sticker-pos1-left').trim(), rot:-16},
        {top:cs.getPropertyValue('--d-sticker-pos2-top').trim(), left:cs.getPropertyValue('--d-sticker-pos2-left').trim(), rot:13},
      ];
      dayData.stickers.slice(0,2).forEach((sid,i)=>{
        const s=stickerById(sid);
        if(!s) return;
        const el=document.createElement('span');
        el.className='sticker';
        el.innerHTML=stickerIconHtml(s);
        el.style.cssText=`top:${pos[i].top};left:${pos[i].left};transform:rotate(${pos[i].rot}deg);`;
        wrap.appendChild(el);
      });
      tile.appendChild(wrap);
    }
    grid.appendChild(tile);
  }
}

// ══════════════════════════════════════
//  MODAL
// ══════════════════════════════════════
function openModal(dateStr){
  editingDate=dateStr;
  const d=parseDate(dateStr);
  document.getElementById('modal-date-title').textContent=`${MONTHS_SHORT[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;

  const dayData=state.days[dateStr]||{};
  selectedOrgasm=dayData.orgasm||'none';
  selectedMood=dayData.mood||null;
  selectedStickers=new Set(dayData.stickers||[]);
  document.getElementById('day-notes').value=dayData.notes||'';

  selectedCage=dayData.cage!==undefined?dayData.cage:(()=>{
    const prev=state.days[getPrevDate(dateStr)];
    return prev?(prev.cage||'none'):'none';
  })();

  const idx=parseInt(dateStr.replace(/-/g,''))%MOOD_PROMPTS.length;
  document.getElementById('mood-prompt').textContent=MOOD_PROMPTS[idx]();

  document.querySelectorAll('.mood-pill').forEach(p=>p.classList.toggle('selected',p.dataset.val===selectedMood));
  document.querySelectorAll('#orgasm-pills .pill').forEach(p=>{
    p.className='pill'; if(p.dataset.val===selectedOrgasm) p.classList.add(`sel-${p.dataset.col}`);
  });
  renderCagePills(); renderStickerPicker();
  document.getElementById('modal-overlay').classList.add('open');
}

function renderCagePills(){
  const wrap=document.getElementById('cage-pills'); wrap.innerHTML='';
  const noneBtn=document.createElement('button');
  noneBtn.className='pill'+(selectedCage==='none'?' sel-def':'');
  noneBtn.innerHTML=`<img src="icons/icon-unlock.png" alt="">no cage`;
  noneBtn.onclick=()=>{selectedCage='none';document.querySelectorAll('#cage-pills .pill').forEach(p=>p.className='pill');noneBtn.classList.add('sel-def');};
  wrap.appendChild(noneBtn);

  state.cages.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='pill'+(c.id===selectedCage?' sel-def':'');
    btn.innerHTML=`<img src="${cageIconSrc(c.icon)}" alt="">${c.name}`;
    btn.onclick=()=>{selectedCage=c.id;document.querySelectorAll('#cage-pills .pill').forEach(p=>p.className='pill');btn.classList.add('sel-def');};
    wrap.appendChild(btn);
  });
}

function renderStickerPicker(){
  const wrap=document.getElementById('sticker-picker'); wrap.innerHTML='';
  allStickers().forEach(s=>{
    const btn=document.createElement('button');
    btn.className='sticker-pick'+(selectedStickers.has(s.id)?' selected':'');
    btn.dataset.id=s.id;
    btn.innerHTML=`${stickerIconHtml(s)}<span class="sticker-label">${s.label}</span>`;
    btn.onclick=()=>{
      if(selectedStickers.has(s.id)) selectedStickers.delete(s.id); else selectedStickers.add(s.id);
      btn.classList.toggle('selected',selectedStickers.has(s.id));
    };
    wrap.appendChild(btn);
  });
  const add=document.createElement('button');
  add.className='sticker-add-btn'; add.innerHTML='＋'; add.onclick=openAddSticker;
  wrap.appendChild(add);
}

function selectOrgasm(btn){
  document.querySelectorAll('#orgasm-pills .pill').forEach(p=>p.className='pill');
  selectedOrgasm=btn.dataset.val; btn.classList.add(`sel-${btn.dataset.col}`);
}
function selectMood(btn){
  if(selectedMood===btn.dataset.val){selectedMood=null;btn.classList.remove('selected');return;}
  document.querySelectorAll('.mood-pill').forEach(p=>p.classList.remove('selected'));
  selectedMood=btn.dataset.val; btn.classList.add('selected');
}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); editingDate=null; }
function closeModalOnOverlay(e){ if(e.target===document.getElementById('modal-overlay')) closeModal(); }

function saveDay(){
  if(!editingDate) return;
  state.days[editingDate]={orgasm:selectedOrgasm,cage:selectedCage,stickers:[...selectedStickers],notes:document.getElementById('day-notes').value,mood:selectedMood};
  save(); renderCalendar(); renderLegend(); renderStatTiles();
  if(ORGASM_MSGS[selectedOrgasm]) showToast(pick(ORGASM_MSGS[selectedOrgasm])());
  if(selectedMood&&MOOD_MSGS[selectedMood]) showToast(pick(MOOD_MSGS[selectedMood])());
  if(selectedStickers.size>0) maybeStickerToast([...selectedStickers]);
  closeModal();
}
function clearDay(){
  if(!editingDate) return;
  delete state.days[editingDate];
  save(); renderCalendar(); renderLegend(); renderStatTiles(); closeModal();
}

// ══════════════════════════════════════
//  CUSTOM STICKER
// ══════════════════════════════════════
function openAddSticker(){
  document.getElementById('emoji-input').value='';
  document.getElementById('sticker-name-input').value='';
  document.getElementById('emoji-preview-display').textContent='🐾';
  document.getElementById('add-sticker-overlay').classList.add('open');
}
function closeAddStickerOnOverlay(e){ if(e.target===document.getElementById('add-sticker-overlay')) document.getElementById('add-sticker-overlay').classList.remove('open'); }
function updateEmojiPreview(v){ document.getElementById('emoji-preview-display').textContent=[...v.trim()].slice(0,2).join('')||'🐾'; }
function saveCustomSticker(){
  const emoji=[...document.getElementById('emoji-input').value.trim()].slice(0,2).join('')||'⭐';
  const label=document.getElementById('sticker-name-input').value.trim()||'custom';
  state.customStickers.push({id:'custom-'+Date.now(),emoji,label,icon:null,enabled:true});
  save(); document.getElementById('add-sticker-overlay').classList.remove('open');
  renderStickerPicker(); showToast(`sticker "${label}" added! ✨`);
}

// ══════════════════════════════════════
//  CAGES
// ══════════════════════════════════════
function renderCageSettings(){
  const list=document.getElementById('cage-list'); if(!list) return;
  list.innerHTML='';
  state.cages.forEach((c,i)=>{
    const row=document.createElement('div'); row.className='cage-row';
    const preview=document.createElement('button');
    preview.className='cage-icon-preview';
    preview.innerHTML=`<img src="${cageIconSrc(c.icon)}" alt="">`;
    preview.onclick=()=>openCagePicker(i);
    row.appendChild(preview);

    const input=document.createElement('input');
    input.className='cage-name-input';
    input.value=c.name;
    input.onchange=()=>{ state.cages[i].name=input.value; save(); };
    row.appendChild(input);

    if(state.cages.length>1){
      const rm=document.createElement('button');
      rm.className='cage-remove-btn';
      rm.innerHTML='✕';
      rm.onclick=()=>removeCage(i);
      row.appendChild(rm);
    }
    list.appendChild(row);
  });
  const addBtn=document.getElementById('add-cage-btn');
  addBtn.disabled=state.cages.length>=MAX_CAGES;
  addBtn.textContent=state.cages.length>=MAX_CAGES?`max ${MAX_CAGES} cages reached`:'＋ add a cage';
}

function addCage(){
  if(state.cages.length>=MAX_CAGES) return;
  const usedIcons=new Set(state.cages.map(c=>c.icon));
  const nextIcon=CAGE_OPTIONS.find(o=>!usedIcons.has(o.id))||CAGE_OPTIONS[0];
  const letter=String.fromCharCode(65+state.cages.length);
  state.cages.push({id:'c'+Date.now(), name:`Cage ${letter}`, icon:nextIcon.id});
  save(); renderCageSettings();
}
function removeCage(i){
  const removed=state.cages[i];
  state.cages.splice(i,1);
  // unassign any days using this cage
  Object.values(state.days).forEach(day=>{ if(day.cage===removed.id) day.cage='none'; });
  save(); renderCageSettings(); renderCalendar(); renderStatTiles();
}

function openCagePicker(idx){
  cagePickerTargetIdx=idx;
  const grid=document.getElementById('cage-picker-grid');
  grid.innerHTML='';
  const currentIcon=state.cages[idx].icon;
  CAGE_OPTIONS.forEach(o=>{
    const btn=document.createElement('button');
    btn.className='cage-picker-item'+(o.id===currentIcon?' selected':'');
    btn.title=o.label;
    btn.innerHTML=`<img src="${cageIconSrc(o.id)}" alt="${o.label}">`;
    btn.onclick=()=>{
      state.cages[cagePickerTargetIdx].icon=o.id;
      save(); renderCageSettings(); renderCalendar();
      document.getElementById('cage-picker-overlay').classList.remove('open');
    };
    grid.appendChild(btn);
  });
  document.getElementById('cage-picker-overlay').classList.add('open');
}
function closeCagePickerOnOverlay(e){ if(e.target===document.getElementById('cage-picker-overlay')) document.getElementById('cage-picker-overlay').classList.remove('open'); }

// ══════════════════════════════════════
//  SETTINGS RENDERS
// ══════════════════════════════════════
function setStartDate(v){ state.startDate=v||null; save(); renderCalendar(); renderStatTiles(); }

const DENSITY_OPTIONS = [
  {id:'default', name:'default', desc:'bigger, fuller'},
  {id:'compact', name:'compact', desc:'smaller, airy'},
];
function renderDensityGrid(){
  const grid=document.getElementById('density-grid'); if(!grid) return;
  grid.innerHTML='';
  DENSITY_OPTIONS.forEach(d=>{
    const btn=document.createElement('button');
    btn.className='palette-btn'+(state.density===d.id?' active':'');
    btn.style.background='var(--c-white)'; btn.style.color='var(--c-text)';
    btn.innerHTML=`<div>${d.name}</div><div style="font-size:10px;font-weight:700;color:var(--c-textlt)">${d.desc}</div>`;
    btn.onclick=()=>{
      state.density=d.id;
      document.body.setAttribute('data-density',d.id);
      save(); renderDensityGrid(); renderCalendar(); renderStatTiles();
    };
    grid.appendChild(btn);
  });
}

function renderPaletteGrid(){
  const grid=document.getElementById('palette-grid'); if(!grid) return;
  grid.innerHTML='';
  THEMES.forEach(t=>{
    const btn=document.createElement('button');
    btn.className='palette-btn'+(state.theme===t.id?' active':'');
    btn.style.background=t.bg; btn.style.color=t.light?'#5a4a5a':'#f0f0f0';
    btn.innerHTML=`<div class="palette-swatches">${t.swatches.map(c=>`<div class="swatch" style="background:${c}"></div>`).join('')}</div>${t.name}`;
    btn.onclick=()=>{ state.theme=t.id; document.body.setAttribute('data-theme',t.id); save(); renderPaletteGrid(); };
    grid.appendChild(btn);
  });
}

// ── IDENTITY TAGS ──
const PRESET_IDENTITY_TAGS = ['girl','boy','pup','puppy','mutt','toy'];
const MAX_CUSTOM_IDENTITY = 5;

function renderIdentityTags(){
  const wrap=document.getElementById('identity-tag-group'); if(!wrap) return;
  wrap.innerHTML='';
  PRESET_IDENTITY_TAGS.forEach(tag=>{
    const btn=document.createElement('button');
    btn.className='identity-tag'+(state.identityTags.includes(tag)?' active':'');
    btn.textContent=tag;
    btn.onclick=()=>toggleIdentityTag(tag, btn);
    wrap.appendChild(btn);
  });

  const customWrap=document.getElementById('identity-custom-wrap');
  customWrap.innerHTML='';
  state.customIdentityTags.forEach((t,i)=>{
    const row=document.createElement('div');
    row.className='identity-custom-row';
    const inp=document.createElement('input');
    inp.className='identity-custom-input';
    inp.value=t.value||'';
    inp.placeholder='your tag...';
    inp.maxLength=20;
    inp.oninput=()=>{ state.customIdentityTags[i].value=inp.value.trim(); save(); };
    const rm=document.createElement('button');
    rm.className='identity-custom-remove';
    rm.innerHTML='✕';
    rm.onclick=()=>{ state.customIdentityTags.splice(i,1); save(); renderIdentityTags(); };
    row.appendChild(inp); row.appendChild(rm);
    customWrap.appendChild(row);
  });

  const addBtn=document.getElementById('add-identity-btn');
  addBtn.disabled=state.customIdentityTags.length>=MAX_CUSTOM_IDENTITY;
  addBtn.textContent=state.customIdentityTags.length>=MAX_CUSTOM_IDENTITY?`max ${MAX_CUSTOM_IDENTITY} custom tags`:'＋ add your own';
}

function toggleIdentityTag(tag, btn){
  const allActive=[...state.identityTags,...state.customIdentityTags.filter(t=>t.value).map(t=>t.value)];
  if(state.identityTags.includes(tag)){
    if(allActive.length<=1) return; // enforce at least one selected
    state.identityTags=state.identityTags.filter(t=>t!==tag);
    btn.classList.remove('active');
  } else {
    state.identityTags.push(tag);
    btn.classList.add('active');
  }
  save();
}

function addCustomIdentityTag(){
  if(state.customIdentityTags.length>=MAX_CUSTOM_IDENTITY) return;
  state.customIdentityTags.push({value:''});
  save(); renderIdentityTags();
  // focus the new input
  const inputs=document.querySelectorAll('.identity-custom-input');
  if(inputs.length) inputs[inputs.length-1].focus();
}

function toggleStickers(){
  state.showStickers=!state.showStickers;
  document.getElementById('sticker-toggle').classList.toggle('on',state.showStickers);
  save(); renderCalendar();
}
function clearAllData(){
  if(!confirm('clear all data? this cannot be undone 🥺')) return;
  state.days={}; save(); renderCalendar(); renderStatTiles();
}

// ══════════════════════════════════════
//  NAV
// ══════════════════════════════════════
function switchView(v){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.getElementById('nav-'+v).classList.add('active');
  if(v==='settings'){ renderCageSettings(); renderPaletteGrid(); renderDensityGrid(); renderStatSettingsList(); renderIdentityTags(); }
}
function exportImage(){ showToast('long pressed — screenshot now to share!'); }

init();
</script>
