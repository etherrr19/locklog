<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="pup log 🐾">
<title>pup log 🐾</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  :root {
    --mint: #b8e8d4;
    --mint-dark: #8ed4b8;
    --pink: #f7c5d5;
    --pink-dark: #f0a0bc;
    --peach: #ffd4b8;
    --peach-dark: #ffb894;
    --red: #ffb3b3;
    --red-dark: #ff8e8e;
    --lavender: #e8d4f7;
    --cream: #fdf8f0;
    --white: #ffffff;
    --text: #5a4a5a;
    --text-light: #9a8a9a;
    --border: #ecddf0;
    --shadow: rgba(180,150,190,0.15);
    --shadow-md: rgba(180,150,190,0.25);
    --radius-tile: 16px;
    --radius-lg: 24px;
    --radius-xl: 32px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #fdf0f8 0%, #f0f8fd 50%, #f8fdf0 100%);
    min-height: 100vh;
    min-height: -webkit-fill-available;
    color: var(--text);
    overflow-x: hidden;
  }

  /* ── APP SHELL ── */
  .app {
    max-width: 430px;
    margin: 0 auto;
    padding: env(safe-area-inset-top, 12px) 0 80px;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    padding: 16px 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-title {
    font-family: 'Fredoka One', cursive;
    font-size: 28px;
    color: var(--text);
    letter-spacing: 0.5px;
  }
  .header-title span { color: #c9a0dc; }
  .header-streak {
    background: var(--pink);
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* ── MONTH NAV ── */
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px 16px;
  }
  .month-label {
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    color: var(--text);
  }
  .nav-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--white);
    box-shadow: 0 2px 8px var(--shadow-md);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, box-shadow 0.15s;
    color: var(--text);
  }
  .nav-btn:active { transform: scale(0.92); }

  /* ── LEGEND ── */
  .legend {
    display: flex;
    gap: 8px;
    padding: 0 20px 16px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 700; color: var(--text-light);
    letter-spacing: 0.3px;
  }
  .legend-dot {
    width: 12px; height: 12px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  /* ── CALENDAR GRID ── */
  .calendar-wrap { padding: 0 14px; }
  .day-labels {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 6px;
  }
  .day-label {
    text-align: center;
    font-size: 11px;
    font-weight: 800;
    color: var(--text-light);
    letter-spacing: 0.5px;
  }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }

  /* ── TILE ── */
  .tile {
    aspect-ratio: 1;
    border-radius: var(--radius-tile);
    position: relative;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    overflow: visible;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .tile:active { transform: scale(0.92); }
  .tile.empty { background: transparent; cursor: default; pointer-events: none; }
  .tile.future { background: rgba(255,255,255,0.5); cursor: default; }
  .tile.today .tile-inner::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: calc(var(--radius-tile) + 2px);
    border: 2px solid #c9a0dc;
    pointer-events: none;
  }

  .tile-inner {
    position: absolute;
    inset: 0;
    border-radius: var(--radius-tile);
    box-shadow: 0 2px 8px var(--shadow);
  }
  .tile-bg-none    { background: var(--mint); }
  .tile-bg-orgasm  { background: var(--pink); }
  .tile-bg-ruined  { background: var(--peach); }
  .tile-bg-forbidden { background: var(--red); }
  .tile-bg-empty   { background: rgba(255,255,255,0.6); }

  /* date number */
  .tile-date {
    position: absolute;
    top: 5px; left: 7px;
    font-size: 11px;
    font-weight: 800;
    color: var(--text);
    opacity: 0.7;
    z-index: 2;
    line-height: 1;
  }

  /* cage icon corner */
  .tile-cage {
    position: absolute;
    bottom: 4px; right: 5px;
    font-size: 11px;
    z-index: 3;
    line-height: 1;
  }

  /* stickers */
  .tile-stickers {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
  }
  .sticker {
    position: absolute;
    font-size: 13px;
    line-height: 1;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.15));
    transform-origin: center;
  }

  /* ── STATS BAR ── */
  .stats-bar {
    display: flex;
    gap: 10px;
    padding: 16px 20px 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .stats-bar::-webkit-scrollbar { display: none; }
  .stat-card {
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 12px 16px;
    min-width: 100px;
    flex-shrink: 0;
    box-shadow: 0 2px 12px var(--shadow);
    text-align: center;
  }
  .stat-value {
    font-family: 'Fredoka One', cursive;
    font-size: 26px;
    color: var(--text);
    line-height: 1;
  }
  .stat-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-light);
    letter-spacing: 0.5px;
    margin-top: 3px;
  }

  /* ── FEEDBACK TOAST ── */
  .toast {
    position: fixed;
    top: 60px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--white);
    border-radius: 24px;
    padding: 12px 20px;
    box-shadow: 0 4px 24px var(--shadow-md);
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    white-space: nowrap;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(100,80,110,0.3);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }
  .modal {
    background: var(--cream);
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    padding: 20px 20px calc(env(safe-area-inset-bottom, 16px) + 20px);
    width: 100%;
    max-width: 430px;
    transform: translateY(40px);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 16px;
  }
  .modal-title {
    font-family: 'Fredoka One', cursive;
    font-size: 20px;
    margin-bottom: 16px;
    text-align: center;
    color: var(--text);
  }

  /* form sections */
  .form-section { margin-bottom: 18px; }
  .form-label {
    font-size: 12px;
    font-weight: 800;
    color: var(--text-light);
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    display: block;
  }

  /* pill selectors */
  .pill-group { display: flex; flex-wrap: wrap; gap: 7px; }
  .pill {
    padding: 7px 14px;
    border-radius: 20px;
    border: 2px solid transparent;
    background: var(--white);
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 1px 4px var(--shadow);
  }
  .pill:active { transform: scale(0.95); }
  .pill.selected-mint   { background: var(--mint);   border-color: var(--mint-dark); }
  .pill.selected-pink   { background: var(--pink);   border-color: var(--pink-dark); }
  .pill.selected-peach  { background: var(--peach);  border-color: var(--peach-dark); }
  .pill.selected-red    { background: var(--red);    border-color: var(--red-dark); }
  .pill.selected-lav    { background: var(--lavender); border-color: #c9a0dc; }
  .pill.selected-default { background: var(--lavender); border-color: #c9a0dc; }

  /* sticker picker */
  .sticker-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .sticker-pick {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: var(--white);
    border: 2px solid transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 1px 4px var(--shadow);
    transition: all 0.15s;
    position: relative;
  }
  .sticker-pick:active { transform: scale(0.9); }
  .sticker-pick.selected { border-color: #c9a0dc; background: var(--lavender); }
  .sticker-pick .sticker-label {
    position: absolute;
    bottom: -16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 8px;
    font-weight: 700;
    color: var(--text-light);
    white-space: nowrap;
    letter-spacing: 0.2px;
  }

  /* notes */
  .notes-input {
    width: 100%;
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 10px 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--white);
    resize: none;
    outline: none;
    transition: border-color 0.15s;
  }
  .notes-input:focus { border-color: #c9a0dc; }

  /* save button */
  .save-btn {
    width: 100%;
    padding: 14px;
    border-radius: 20px;
    border: none;
    background: linear-gradient(135deg, #f0c0d8, #c9a0dc);
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
    color: white;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(200,160,220,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
    margin-top: 4px;
  }
  .save-btn:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(200,160,220,0.3); }

  /* delete btn */
  .delete-btn {
    width: 100%;
    padding: 10px;
    border-radius: 16px;
    border: 2px solid var(--border);
    background: transparent;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.15s;
  }
  .delete-btn:active { background: var(--red); color: var(--text); border-color: var(--red-dark); }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding: 8px 0 calc(env(safe-area-inset-bottom, 0px) + 8px);
    display: flex;
    justify-content: space-around;
    z-index: 50;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px 16px;
    cursor: pointer;
    border-radius: 14px;
    transition: background 0.15s;
    border: none; background: transparent;
  }
  .nav-item.active { background: var(--lavender); }
  .nav-icon { font-size: 22px; line-height: 1; }
  .nav-text { font-size: 10px; font-weight: 800; color: var(--text-light); letter-spacing: 0.3px; }
  .nav-item.active .nav-text { color: #9a60b4; }

  /* ── EXPORT BUTTON ── */
  .export-btn {
    display: flex; align-items: center; gap: 6px;
    margin: 16px 20px 0;
    padding: 10px 16px;
    border-radius: 16px;
    border: 2px solid var(--border);
    background: var(--white);
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    box-shadow: 0 1px 4px var(--shadow);
    transition: all 0.15s;
    width: calc(100% - 40px);
    justify-content: center;
  }
  .export-btn:active { transform: scale(0.97); }

  /* ── SETTINGS VIEW ── */
  .view { display: none; padding: 0 20px; }
  .view.active { display: block; }

  .settings-section { margin-bottom: 24px; }
  .settings-title {
    font-family: 'Fredoka One', cursive;
    font-size: 16px;
    margin-bottom: 10px;
    color: var(--text);
  }

  .cage-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--white);
    border-radius: 14px;
    padding: 10px 14px;
    margin-bottom: 8px;
    box-shadow: 0 1px 4px var(--shadow);
  }
  .cage-icon-preview { font-size: 22px; width: 32px; text-align: center; }
  .cage-name-input {
    flex: 1;
    border: none; outline: none;
    font-family: 'Nunito', sans-serif;
    font-size: 14px; font-weight: 700;
    color: var(--text);
    background: transparent;
  }

  /* sticker toggle */
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--white);
    border-radius: 14px;
    padding: 12px 14px;
    box-shadow: 0 1px 4px var(--shadow);
  }
  .toggle-label { font-size: 14px; font-weight: 700; color: var(--text); }
  .toggle {
    width: 44px; height: 26px;
    border-radius: 13px;
    background: var(--border);
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
    border: none;
  }
  .toggle.on { background: linear-gradient(135deg, #f0c0d8, #c9a0dc); }
  .toggle::after {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: white;
    top: 3px; left: 3px;
    transition: transform 0.2s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  .toggle.on::after { transform: translateX(18px); }

  /* decorative paws */
  .deco-paw {
    position: fixed;
    font-size: 80px;
    opacity: 0.04;
    pointer-events: none;
    z-index: 0;
    user-select: none;
  }

  /* canvas for export (hidden) */
  #export-canvas { display: none; }
</style>
</head>
<body>

<div class="deco-paw" style="top:-10px;right:-20px;transform:rotate(20deg)">🐾</div>
<div class="deco-paw" style="bottom:100px;left:-20px;transform:rotate(-15deg)">🐾</div>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-title">pup log <span>🐾</span></div>

  <!-- STATS BAR -->
  <div class="stats-bar">

    <div class="settings-section">
      <div class="settings-title">🗑 data</div>

    </div>
  </div>

</div><!-- /app -->

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="nav-item active" id="nav-calendar" onclick="switchView('calendar')">
    <div class="nav-icon">📅</div>
    <div class="nav-text">CALENDAR</div>
  </button>
  <button class="nav-item" id="nav-settings" onclick="switchView('settings')">
    <div class="nav-icon">⚙️</div>
    <div class="nav-text">SETTINGS</div>
  </button>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- DAY MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-date-title"></div>

    <!-- Orgasm status -->
    <div class="form-section">
      <span class="form-label">ORGASM STATUS</span>
      <div class="pill-group" id="orgasm-pills">

        <button class="pill" data-val="ruined" data-color="peach" onclick="selectPill('orgasm',this)">🍑 ruined</button>
        <button class="pill" data-val="forbidden" data-color="red" onclick="selectPill('orgasm',this)">🚫 forbidden</button>
        <button class="pill" data-val="edged" data-color="lav" onclick="selectPill('orgasm',this)">🔥 edged only</button>
      </div>
    </div>

    <!-- Cage status -->
    <div class="form-section">
      <span class="form-label">CAGE STATUS</span>
      <div class="pill-group" id="cage-pills"></div>
    </div>

    <!-- Stickers -->
    <div class="form-section">
      <span class="form-label">STICKERS (tap to add/remove)</span>
      <div class="sticker-grid" id="sticker-picker">
        <!-- populated by JS -->
      </div>
      <div style="height:20px"></div>
    </div>

    <!-- Notes -->
    <div class="form-section">
      <span class="form-label">NOTES</span>
      <textarea class="notes-input" id="day-notes" rows="2" placeholder="anything to remember..."></textarea>
    </div>

    <button class="save-btn" onclick="saveDay()">save 🐾</button>
    <button class="delete-btn" onclick="clearDay()">clear this day</button>
  </div>
</div>

<canvas id="export-canvas"></canvas>

<script>
// ── STATE ──
const STORAGE_KEY = 'puplog_v1';
let state = {
  days: {},         // "YYYY-MM-DD": { orgasm, cage, stickers[], notes }
  cages: ['Cage A','Cage B','Cage C'],
  showStickers: true
};

const STICKERS = [
  { id:'paw-o',    emoji:'🐾', label:'paw orgasm' },
  { id:'vibe-o',   emoji:'📳', label:'vibe orgasm' },
  { id:'anal-o',   emoji:'〰️', label:'anal orgasm' },
  { id:'hf-o',     emoji:'🤲', label:'handsfree' },
  { id:'other-o',  emoji:'✨', label:'other orgasm' },
  { id:'paw-e',    emoji:'🐾🔥', label:'paw edge' },
  { id:'vibe-e',   emoji:'📳🔥', label:'vibe edge' },
  { id:'other-e',  emoji:'🔥', label:'other edge' },
  { id:'cage-chg', emoji:'🔄', label:'cage change' },
  { id:'downsize', emoji:'⬇️🔒', label:'downsize' },
  { id:'misbehav', emoji:'😈', label:'misbehavior' },
  { id:'punish',   emoji:'⚡', label:'punishment' },
  { id:'reward',   emoji:'🎁', label:'reward' },
  { id:'bad-slp',  emoji:'😴', label:'bad sleep' },
  { id:'discomfort',emoji:'🩹', label:'discomfort' },
  { id:'key',      emoji:'🔑', label:'key access' },
  { id:'inspect',  emoji:'🔍', label:'inspection' },
];

const CAGE_ICONS = ['○','🅰','🅱','🅲','🅳'];

let currentYear, currentMonth, editingDate = null, selectedOrgasm = 'none', selectedCage = 'none', selectedStickers = new Set();

// ── LOAD/SAVE ──
function load() {
  try { const s = localStorage.getItem(STORAGE_KEY); if(s) state = {...state, ...JSON.parse(s)}; } catch(e){}
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}

// ── INIT ──
function init() {
  load();
  const now = new Date();
  currentYear = now.getFullYear();
  currentMonth = now.getMonth();
  renderCageSettings();
  renderStickerPicker();
  renderCalendar();
  updateStats();
}

// ── CALENDAR ──
function changeMonth(dir) {
  currentMonth += dir;
  if(currentMonth > 11) { currentMonth = 0; currentYear++; }
  if(currentMonth < 0)  { currentMonth = 11; currentYear--; }
  renderCalendar();
  updateStats();
}

function renderCalendar() {
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('month-label').textContent = `${months[currentMonth]} ${currentYear}`;

  const grid = document.getElementById('calendar-grid');
  grid.innerHTML = '';

  const today = new Date();
  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();

  // empty cells
  for(let i=0;i<firstDay;i++) {
    const el = document.createElement('div');
    el.className = 'tile empty';
    grid.appendChild(el);
  }

  for(let d=1; d<=daysInMonth; d++) {
    const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayData = state.days[dateStr];
    const isToday = (today.getFullYear()===currentYear && today.getMonth()===currentMonth && today.getDate()===d);
    const isFuture = new Date(currentYear,currentMonth,d) > today;

    const tile = document.createElement('div');
    tile.className = 'tile' + (isToday?' today':'') + (isFuture?' future':'');
    tile.onclick = () => !isFuture && openModal(dateStr);

    // inner
    const inner = document.createElement('div');
    inner.className = 'tile-inner';
    if(isFuture) {
      inner.classList.add('tile-bg-empty');
    } else if(dayData) {
      const bgMap = {none:'tile-bg-none', orgasm:'tile-bg-orgasm', ruined:'tile-bg-ruined', forbidden:'tile-bg-forbidden', edged:'tile-bg-none'};
      inner.classList.add(bgMap[dayData.orgasm] || 'tile-bg-none');
    } else {
      inner.classList.add('tile-bg-none');
    }
    tile.appendChild(inner);

    // date number
    const dateEl = document.createElement('div');
    dateEl.className = 'tile-date';
    dateEl.textContent = d;
    tile.appendChild(dateEl);

    // cage icon
    if(dayData && dayData.cage && dayData.cage !== 'none') {
      const cageEl = document.createElement('div');
      cageEl.className = 'tile-cage';
      const idx = ['A','B','C','D'].indexOf(dayData.cage);
      cageEl.textContent = idx>=0 ? CAGE_ICONS[idx+1] : '○';
      tile.appendChild(cageEl);
    } else if(dayData && dayData.cage === 'none') {
      const cageEl = document.createElement('div');
      cageEl.className = 'tile-cage';
      cageEl.textContent = '○';
      tile.appendChild(cageEl);
    }

    // stickers
    if(state.showStickers && dayData && dayData.stickers && dayData.stickers.length) {
      const stickerWrap = document.createElement('div');
      stickerWrap.className = 'tile-stickers';
      const positions = [
        {top:'18%',left:'12%',rot:-15},{top:'40%',left:'55%',rot:12},
        {top:'55%',left:'10%',rot:8},{top:'20%',left:'50%',rot:-8}
      ];
      dayData.stickers.slice(0,3).forEach((sid,i) => {
        const s = STICKERS.find(x=>x.id===sid);
        if(!s) return;
        const pos = positions[i % positions.length];
        const el = document.createElement('span');
        el.className = 'sticker';
        el.textContent = s.emoji;
        el.style.cssText = `top:${pos.top};left:${pos.left};transform:rotate(${pos.rot}deg);font-size:${i===0?'11px':'9px'}`;
        stickerWrap.appendChild(el);
      });
      tile.appendChild(stickerWrap);
    }

    grid.appendChild(tile);
  }
}

// ── STATS ──
function updateStats() {
  const prefix = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
  let locked=0, orgasms=0, ruined=0, edges=0;
  Object.entries(state.days).forEach(([k,v])=>{
    if(!k.startsWith(prefix)) return;
    if(v.cage && v.cage!=='none') locked++;
    if(v.orgasm==='orgasm') orgasms++;
    if(v.orgasm==='ruined') ruined++;
    if(v.orgasm==='edged') edges++;
  });
  document.getElementById('stat-locked').textContent = locked;
  document.getElementById('stat-orgasms').textContent = orgasms;
  document.getElementById('stat-ruined').textContent = ruined;
  document.getElementById('stat-edges').textContent = edges;

  // streak
  const today = new Date();
  let streak = 0;
  for(let i=0;i<365;i++) {
    const d = new Date(today); d.setDate(d.getDate()-i);
    const ds = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const day = state.days[ds];
    if(day && day.cage && day.cage!=='none') streak++;
    else if(i>0) break;
  }
  document.getElementById('streak-badge').textContent = `🔒 ${streak} day${streak!==1?'s':''}`;
  checkFeedback(streak);
}

// ── FEEDBACK ──
function checkFeedback(streak) {
  const msgs = [
    {min:6,max:10,  msg:"good puppy! 🐾"},
    {min:11,max:20, msg:"such a patient pup! 🔒✨"},
    {min:21,max:999,msg:"owner must be very proud 🥺🐶"},
  ];
  const match = msgs.find(m=>streak>=m.min&&streak<=m.max);
  if(match && streak > 0) showToast(match.msg);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}

// ── MODAL ──
function openModal(dateStr) {
  editingDate = dateStr;
  const d = new Date(dateStr + 'T00:00:00');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('modal-date-title').textContent =
    `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;

  const dayData = state.days[dateStr] || {};
  selectedOrgasm = dayData.orgasm || 'none';
  selectedCage = dayData.cage || 'none';
  selectedStickers = new Set(dayData.stickers || []);
  document.getElementById('day-notes').value = dayData.notes || '';

  // orgasm pills
  document.querySelectorAll('#orgasm-pills .pill').forEach(p=>{
    p.className = 'pill';
    if(p.dataset.val === selectedOrgasm) p.classList.add(`selected-${p.dataset.color}`);
  });

  // cage pills
  renderCagePills();

  // stickers
  document.querySelectorAll('.sticker-pick').forEach(sp=>{
    sp.classList.toggle('selected', selectedStickers.has(sp.dataset.id));
  });

  document.getElementById('modal-overlay').classList.add('open');
}

function renderCagePills() {
  const wrap = document.getElementById('cage-pills');
  wrap.innerHTML = '';
  const opts = [{val:'none',label:'🔓 no cage'}, ...state.cages.map((c,i)=>({val:'ABCD'[i], label:`${CAGE_ICONS[i+1]} ${c}`}))];
  opts.forEach(o=>{
    const btn = document.createElement('button');
    btn.className = 'pill' + (o.val===selectedCage?' selected-default':'');
    btn.textContent = o.label;
    btn.onclick = ()=>{
      selectedCage = o.val;
      document.querySelectorAll('#cage-pills .pill').forEach(p=>p.className='pill');
      btn.classList.add('selected-default');
    };
    wrap.appendChild(btn);
  });
}

function renderStickerPicker() {
  const wrap = document.getElementById('sticker-picker');
  wrap.innerHTML = '';
  STICKERS.forEach(s=>{
    const btn = document.createElement('button');
    btn.className = 'sticker-pick';
    btn.dataset.id = s.id;
    btn.innerHTML = `${s.emoji}<span class="sticker-label">${s.label}</span>`;
    btn.onclick = ()=>{
      if(selectedStickers.has(s.id)) selectedStickers.delete(s.id);
      else selectedStickers.add(s.id);
      btn.classList.toggle('selected', selectedStickers.has(s.id));
    };
    wrap.appendChild(btn);
  });
}

function selectPill(group, btn) {
  const pills = btn.closest('.pill-group').querySelectorAll('.pill');
  pills.forEach(p=>p.className='pill');
  selectedOrgasm = btn.dataset.val;
  btn.classList.add(`selected-${btn.dataset.color}`);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editingDate = null;
}
function closeModalOnOverlay(e) {
  if(e.target === document.getElementById('modal-overlay')) closeModal();
}

function saveDay() {
  if(!editingDate) return;
  state.days[editingDate] = {
    orgasm: selectedOrgasm,
    cage: selectedCage,
    stickers: [...selectedStickers],
    notes: document.getElementById('day-notes').value
  };
  save();
  renderCalendar();
  updateStats();

  // event-specific toasts
  const o = selectedOrgasm;
  if(o==='orgasm') showToast('lucky girl! 🌸');
  else if(o==='forbidden') showToast('uh oh... 😬');
  else if(o==='ruined') showToast('so close, pup~ 🍑');

  closeModal();
}

function clearDay() {
  if(!editingDate) return;
  delete state.days[editingDate];
  save(); renderCalendar(); updateStats(); closeModal();
}

// ── SETTINGS ──
function renderCageSettings() {
  const list = document.getElementById('cage-list');
  list.innerHTML = '';
  state.cages.forEach((c,i)=>{
    const row = document.createElement('div');
    row.className = 'cage-row';
    row.innerHTML = `<div class="cage-icon-preview">${CAGE_ICONS[i+1]}</div>
      <input class="cage-name-input" value="${c}" onchange="state.cages[${i}]=this.value;save()">`;
    list.appendChild(row);
  });
}

function toggleStickers() {
  state.showStickers = !state.showStickers;
  const btn = document.getElementById('sticker-toggle');
  btn.classList.toggle('on', state.showStickers);
  save(); renderCalendar();
}

function clearAllData() {
  if(!confirm('clear all data? this cannot be undone 🥺')) return;
  state.days = {};
  save(); renderCalendar(); updateStats();
}

// ── NAV ──
function switchView(v) {
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.getElementById('nav-'+v).classList.add('active');
}

// ── EXPORT ──
function exportImage() {
  const grid = document.getElementById('calendar-grid');
  const wrap = document.querySelector('.calendar-wrap');

  // Use html2canvas if available, otherwise fallback message
  showToast('screenshot this page to share! 📸');
}

// ── START ──
init();
</script>
